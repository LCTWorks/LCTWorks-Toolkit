name: Release NuGet packages

# Two ways to start a release:
#
#  1. Push a branch named release/<target>/<version>
#       target = all | core | telemetry | web | winui
#       e.g. release/all/1.0.2610.2, release/web/1.0.2610.3
#
#  2. Run it manually (Actions > Release NuGet packages > Run workflow), pick the packages and type the version.
#
# Packages released in the same run are built in dependency order and consume each other directly from
# this run's artifacts (no waiting for nuget.org). Packages that are NOT released in this run are consumed
# at the version committed in Directory.Packages.props.
#
# When everything succeeds, Directory.Packages.props is updated with the newly released internal versions,
# committed to the branch the workflow ran on, and that commit is tagged.

on:
  push:
    branches:
      - 'release/all/*'
      - 'release/core/*'
      - 'release/telemetry/*'
      - 'release/web/*'
      - 'release/winui/*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.2610.2)'
        required: true
        type: string
      core:
        description: 'LCTWorks.Core'
        type: boolean
        default: false
      telemetry:
        description: 'LCTWorks.Telemetry'
        type: boolean
        default: false
      web:
        description: 'LCTWorks.Web'
        type: boolean
        default: false
      winui:
        description: 'LCTWorks.WinUI'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # Work out the version, which packages to release and what each one builds against
  # ──────────────────────────────────────────────
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      core: ${{ steps.plan.outputs.core }}
      telemetry: ${{ steps.plan.outputs.telemetry }}
      web: ${{ steps.plan.outputs.web }}
      winui: ${{ steps.plan.outputs.winui }}
      telemetry_deps: ${{ steps.plan.outputs.telemetry_deps }}
      web_deps: ${{ steps.plan.outputs.web_deps }}
      winui_deps: ${{ steps.plan.outputs.winui_deps }}
      released: ${{ steps.plan.outputs.released }}
      tags: ${{ steps.plan.outputs.tags }}

    steps:
      - name: Plan release
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_CORE: ${{ inputs.core }}
          IN_TELEMETRY: ${{ inputs.telemetry }}
          IN_WEB: ${{ inputs.web }}
          IN_WINUI: ${{ inputs.winui }}
        run: |
          set -euo pipefail
          core=false; telemetry=false; web=false; winui=false

          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$IN_VERSION"
            core="$IN_CORE"; telemetry="$IN_TELEMETRY"; web="$IN_WEB"; winui="$IN_WINUI"
          else
            # release/<target>/<version>
            target="$(echo "$REF_NAME" | cut -d/ -f2)"
            version="$(echo "$REF_NAME" | cut -d/ -f3-)"
            case "$target" in
              all)       core=true; telemetry=true; web=true; winui=true ;;
              core)      core=true ;;
              telemetry) telemetry=true ;;
              web)       web=true ;;
              winui)     winui=true ;;
              *) echo "::error::Unknown release target '$target' in branch '$REF_NAME'."; exit 1 ;;
            esac
          fi

          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a valid package version."; exit 1
          fi

          released=(); tags=()
          all=false
          [ "$core" = true ] && [ "$telemetry" = true ] && [ "$web" = true ] && [ "$winui" = true ] && all=true

          add() { # $1 = flag, $2 = package id, $3 = tag prefix
            if [ "$1" = true ]; then
              released+=("$2=$version")
              [ "$all" = true ] || tags+=("$3-$version")
            fi
          }
          add "$core"      LCTWorks.Core      Core
          add "$telemetry" LCTWorks.Telemetry Telemetry
          add "$web"       LCTWorks.Web       Web
          add "$winui"     LCTWorks.WinUI     WinUI
          [ "$all" = true ] && tags=("$version")

          if [ ${#released[@]} -eq 0 ]; then
            echo "::error::No packages selected."; exit 1
          fi

          # Dependencies released in this same run (everything else comes from Directory.Packages.props)
          core_dep="";      [ "$core" = true ]      && core_dep="LCTWorks.Core=$version"
          telemetry_dep=""; [ "$telemetry" = true ] && telemetry_dep="LCTWorks.Telemetry=$version"
          winui_deps="$(printf '%s\n' "$core_dep" "$telemetry_dep" | sed '/^$/d' | paste -sd, -)"

          {
            echo "version=$version"
            echo "core=$core"
            echo "telemetry=$telemetry"
            echo "web=$web"
            echo "winui=$winui"
            echo "telemetry_deps=$core_dep"
            echo "web_deps=$core_dep"
            echo "winui_deps=$winui_deps"
            echo "released=$(IFS=,; echo "${released[*]}")"
            echo "tags=${tags[*]}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release plan — $version"
            echo ""
            echo "| Package | Released | Builds against (this run) |"
            echo "|---|---|---|"
            echo "| LCTWorks.Core | $core | – |"
            echo "| LCTWorks.Telemetry | $telemetry | ${core_dep:-committed versions} |"
            echo "| LCTWorks.Web | $web | ${core_dep:-committed versions} |"
            echo "| LCTWorks.WinUI | $winui | ${winui_deps:-committed versions} |"
            echo ""
            echo "Tags: \`${tags[*]}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────
  # Tier 0 — LCTWorks.Core (no internal deps)
  # ──────────────────────────────────────────────
  core:
    needs: plan
    if: ${{ needs.plan.outputs.core == 'true' }}
    uses: ./.github/workflows/pack-and-publish.yml
    with:
      ProjectName: "LCTWorks.Core/LCTWorks.Core.csproj"
      PackageId: "LCTWorks.Core"
      Version: ${{ needs.plan.outputs.version }}
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  # ──────────────────────────────────────────────
  # Tier 1 — LCTWorks.Telemetry / LCTWorks.Web (depend on Core)
  # `!failure() && !cancelled()` lets these run when Core was skipped (not part of this release).
  # ──────────────────────────────────────────────
  telemetry:
    needs: [plan, core]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.telemetry == 'true' }}
    uses: ./.github/workflows/pack-and-publish.yml
    with:
      ProjectName: "LCTWorks.Telemetry/LCTWorks.Telemetry.csproj"
      PackageId: "LCTWorks.Telemetry"
      Version: ${{ needs.plan.outputs.version }}
      DependencyVersions: ${{ needs.plan.outputs.telemetry_deps }}
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  web:
    needs: [plan, core]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.web == 'true' }}
    uses: ./.github/workflows/pack-and-publish.yml
    with:
      ProjectName: "LCTWorks.Web/LCTWorks.Web.csproj"
      PackageId: "LCTWorks.Web"
      Version: ${{ needs.plan.outputs.version }}
      DependencyVersions: ${{ needs.plan.outputs.web_deps }}
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  # ──────────────────────────────────────────────
  # Tier 2 — LCTWorks.WinUI (depends on Core + Telemetry)
  # ──────────────────────────────────────────────
  winui:
    needs: [plan, core, telemetry]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.winui == 'true' }}
    uses: ./.github/workflows/pack-and-publish.yml
    with:
      ProjectName: "LCTWorks.WinUI/LCTWorks.WinUI.csproj"
      PackageId: "LCTWorks.WinUI"
      Version: ${{ needs.plan.outputs.version }}
      DependencyVersions: ${{ needs.plan.outputs.winui_deps }}
      Runner: "windows-latest"
      UseMSBuild: true
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  # ──────────────────────────────────────────────
  # Commit the new internal versions to Directory.Packages.props and tag that commit.
  # Runs only if every selected package succeeded; after "Re-run failed jobs" it runs again.
  # ──────────────────────────────────────────────
  finalize:
    needs: [plan, core, telemetry, web, winui]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Check out the exact commit that was built, so the tag never lands on unbuilt code.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Update Directory.Packages.props
        shell: pwsh
        run: ./.github/scripts/Set-PackageVersions.ps1 -Versions "${{ needs.plan.outputs.released }}" -IgnoreMissing

      - name: Commit, tag and push
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          TAGS: ${{ needs.plan.outputs.tags }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- Directory.Packages.props; then
            echo "Directory.Packages.props unchanged (no internally consumed package released)."
          else
            git add Directory.Packages.props
            git commit -m "Bump internal package versions to $VERSION [skip ci]"
            # Fails (safely) if the branch moved since the run started.
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

          to_push=()
          for tag in $TAGS; do
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "::warning::Tag $tag already exists; skipping."
            else
              git tag "$tag"
              to_push+=("refs/tags/$tag")
            fi
          done
          if [ ${#to_push[@]} -gt 0 ]; then
            git push origin "${to_push[@]}"
          fi

          echo "Tagged $(git rev-parse --short HEAD): $TAGS" >> "$GITHUB_STEP_SUMMARY"
